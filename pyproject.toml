[project]
name = "snaphouse"
version = "0.0.0"
description = "Synced whole-house audio, configured by Ansible and kept current from this repo."
requires-python = ">=3.11"
# Runtime dependencies the on-device venv installs (uv sync --frozen --no-dev).
# ruamel.yaml is the comment-preserving YAML round-tripper that `snaphouse pair
# speaker` uses to write a paired address into /etc/snaphouse/local.yml without
# dropping the file's hand-written comments.
#
# jeepney is a pure-Python D-Bus client with no dependencies, so it ships one
# universal py3-none-any wheel that installs identically on the x86_64 hub and
# the aarch64 Pis with no build toolchain. The Bluetooth metadata control script
# (lib/snaphouse/avrcp_meta.py) uses it to watch BlueZ over the system bus.
dependencies = [
    "ruamel.yaml>=0.18",
    "jeepney>=0.9",
]

# Hub-only runtime deps. Pillow downscales AirPlay cover art to a small JPEG for
# the frame and the room picker (lib/snaphouse/airplay_meta.py), so it is only
# needed where the AirPlay metadata bridge runs: the hub. The selfupdate venv
# sync adds `--extra hub` only on a host whose roles include hub_input, so the
# Raspberry Pis never install it. tests/python/test_venv_extras.py pins that.
[project.optional-dependencies]
hub = [
    "pillow>=10",
]

# This project is not built or installed as a package. The CLI lives in bin/
# and lib/ and runs in place; uv only manages the test toolchain below.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    # Renders the role Jinja templates in tests (the ALSA aliases), so the PCM
    # names and the empty-address guard are checked without an Ansible apply. Dev
    # only: the on-device venv installs no templating engine.
    "jinja2>=3",
    # Also a runtime dep of the hub extra above. Kept in the dev group too so the
    # cover-downscaling tests (tests/python/test_airplay_meta.py) have Pillow in
    # CI without pulling the whole hub extra; the Pis install neither.
    "pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The CLI code under test lives in lib/ and runs in place (see bin/snaphouse,
# which puts lib/ on PYTHONPATH). Mirror that for the tests so they can import
# the snaphouse package without an install step.
pythonpath = ["lib"]
