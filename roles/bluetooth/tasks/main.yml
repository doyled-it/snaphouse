---
# The Bluetooth stack for machines that send audio to a speaker (the hub to the
# Vizio, nightstand to the JBL) or receive it from a phone (the hub). It installs
# BlueALSA with the A2DP profiles this host needs, keeps the adapters closed to
# pairing except during a deliberate `snaphouse pair` window, and drops in the
# on-device check. Which profiles a host runs is derived from its config: a host
# with a Bluetooth output is an A2DP source, and a host with a receive adapter
# (the hub) is also an A2DP sink.

- name: Install the Bluetooth packages
  ansible.builtin.apt:
    name:
      - bluez
      - bluez-tools
      - bluez-alsa-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

# The hub's receive adapter is a Realtek RTL8761BU USB dongle. Its firmware
# (rtl_bt/rtl8761bu_fw.bin) ships in firmware-realtek, from Debian's
# non-free-firmware component (bookworm and trixie); without it the adapter stays
# down. Everything here runs only where a receive adapter is configured, and is
# tagged hardware so the container check skips it. A source already carrying the
# component is left alone (the patterns skip any line that names it), so a second
# apply changes nothing and a fresh trixie install, which enables the component
# itself, is not rewritten.
- name: Find the Debian apt source files
  ansible.builtin.find:
    paths:
      - /etc/apt
      - /etc/apt/sources.list.d
    patterns:
      - sources.list
      - "*.sources"
      - "*.list"
    contains: '.*debian\.org.*'
  register: bluetooth_apt_sources
  when:
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
  tags:
    - hardware

- name: Enable non-free-firmware in one-line apt sources
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(deb(?:-src)?\s(?!.*non-free-firmware)[^#\n]*debian[^#\n]*\smain\b)'
    replace: '\1 non-free-firmware'
  loop: "{{ bluetooth_apt_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: bluetooth_apt_list_sources
  when:
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
    - item.path is not search('\\.sources$')
  tags:
    - hardware

- name: Enable non-free-firmware in deb822 apt sources
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(Components:(?!.*non-free-firmware)[^\n]*\bmain\b[^\n]*?)[ \t]*$'
    replace: '\1 non-free-firmware'
  loop: "{{ bluetooth_apt_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: bluetooth_apt_deb822_sources
  when:
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
    - item.path is search('\\.sources$')
  tags:
    - hardware

- name: Refresh apt after enabling non-free-firmware
  ansible.builtin.apt:
    update_cache: true
  when:
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
    - bluetooth_apt_list_sources is changed or bluetooth_apt_deb822_sources is changed
  tags:
    - hardware

- name: Install the Realtek Bluetooth firmware for the receive adapter
  ansible.builtin.apt:
    name: firmware-realtek
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
  tags:
    - hardware

# bluez-alsa-utils ships and enables its own bluealsa-aplay.service, which grabs
# every incoming A2DP stream and plays it to the default ALSA device. That takes
# the device before snaphouse-bt-in.service can, so ours fails with "Device or
# resource busy". Stop it, disable it, and mask it so it can never start.
- name: Neutralize Debian's stock bluealsa-aplay service
  ansible.builtin.systemd_service:
    name: bluealsa-aplay.service
    state: stopped
    enabled: false
    masked: true
  when: common_systemd_init
  tags:
    - service

# Daemon-level defaults so an adapter is not pairable just because bluetoothd
# brought it up. AlwaysPairable already defaults to false, but set it so the
# intent is explicit. PairableTimeout defaults to 0 (pairable never reverts on
# its own); bound it to the pairing-window length so that if anything leaves an
# adapter pairable (a crash before the window's cleanup, or a fresh adapter at
# boot or re-plug), the daemon closes it within that bound. DiscoverableTimeout
# is set to the same bound for symmetry. The `snaphouse pair` window sets its own
# timeouts while it is open, so these are the standing floor, not the window.
# bluetoothd reads main.conf only at start, so the handler restarts it, and only
# when the file changed.
- name: Set BlueZ daemon defaults so adapters are not pairable by default
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: '^\[General\]'
    state: present
  loop:
    - regexp: '^#?\s*AlwaysPairable\s*='
      line: "AlwaysPairable = false"
    - regexp: '^#?\s*PairableTimeout\s*='
      line: "PairableTimeout = 120"
    - regexp: '^#?\s*DiscoverableTimeout\s*='
      line: "DiscoverableTimeout = 120"
  notify: Restart bluetooth

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the bluetooth verify check
  ansible.builtin.copy:
    src: verify.d/bluetooth.sh
    dest: /etc/snaphouse/verify.d/bluetooth.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the boot-time adapter lockdown script
  ansible.builtin.copy:
    src: snaphouse-bt-lockdown.sh
    dest: /usr/local/lib/snaphouse-bt-lockdown.sh
    owner: root
    group: root
    mode: "0755"

- name: Ensure the systemd unit directory exists
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the adapter-lockdown service unit
  ansible.builtin.copy:
    src: snaphouse-bt-lockdown.service
    dest: /etc/systemd/system/snaphouse-bt-lockdown.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for bluetooth

# PartOf=bluetooth.service re-runs the lockdown on a bluetoothd restart, but not
# on a USB re-plug, which does not restart the service. This udev rule starts the
# lockdown oneshot again when an hci device is added, so a re-plugged adapter is
# closed too.
- name: Ensure the udev rules directory exists
  ansible.builtin.file:
    path: /etc/udev/rules.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the adapter-lockdown udev rule
  ansible.builtin.copy:
    src: snaphouse-bt-lockdown.rules
    dest: /etc/udev/rules.d/99-snaphouse-bt-lockdown.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

- name: Ensure the bluealsa drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/bluealsa.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the bluealsa A2DP profiles for this host
  ansible.builtin.template:
    src: bluealsa-profiles.conf.j2
    dest: /etc/systemd/system/bluealsa.service.d/snaphouse.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for bluetooth
    - Restart bluealsa

# Make the units known before enabling them on a first install. The handlers are
# gated on systemd, so this is a no-op in the CI container.
- name: Reload systemd now if the units changed
  ansible.builtin.meta: flush_handlers

- name: Enable the boot-time adapter lockdown
  ansible.builtin.systemd_service:
    name: snaphouse-bt-lockdown.service
    enabled: true
    state: started
  # Only on a real systemd host; the CI container has no running init.
  when: common_systemd_init
  tags:
    - service

- name: Enable and start bluealsa
  ansible.builtin.systemd_service:
    name: bluealsa.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service

# The receive adapter is the hub's Bluetooth speaker; without an alias BlueZ
# advertises it from the hostname (for example "house #1"). Name it after the
# house speaker so a phone sees "House", matching the AirPlay name. A
# non-empty bt_receive_alias in local.yml overrides the name for Bluetooth only.
# AirPlay and the stream names keep house_stream_name. Only the hub
# has a receive adapter. The alias persists in BlueZ once set. no_log keeps the
# adapter address (read from the var) out of Ansible's output; the address lives
# only in local.yml. system-alias needs the controller selected in the same
# bluetoothctl session, so both commands share one heredoc.
- name: Name the receive adapter after the house speaker
  ansible.builtin.shell:
    cmd: |
      bluetoothctl <<EOF
      select {{ bt_receive_adapter }}
      system-alias {{ bt_receive_alias | default(house_stream_name, true) }}
      EOF
  when:
    - common_systemd_init
    - bt_receive_adapter is defined
    - bt_receive_adapter | length > 0
  changed_when: false
  no_log: true
  tags:
    - hardware
    - service
