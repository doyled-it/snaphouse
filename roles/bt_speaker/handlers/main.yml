---
# Gated on common_systemd_init (real machine only) and tagged service, so the
# reload never runs in the CI container but is still marked for a real-host
# --skip-tags service run.

- name: Reload systemd for bt_speaker
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: common_systemd_init
  tags:
    - service

# The listener runs the code in place from /opt/snaphouse, so a changed module
# needs a restart to take effect (see the digest task in tasks/main.yml).
- name: Restart the speaker buttons service
  ansible.builtin.systemd_service:
    name: snaphouse-avrcp-keys.service
    state: restarted
  when: common_systemd_init
  tags:
    - service
