---
# Keep a Bluetooth speaker connected and own snapclient's lifecycle on this host.
# The speaker is off much of the time; a 30-second timer runs the keepalive,
# which reconnects it whenever it powers on, starts snapclient when the link
# comes up and stops it when the speaker drops, and logs only when the connection
# state changes. A speaker off for days leaves one log line rather than a restart
# loop filling the journal, and it recovers within a tick plus the start (design:
# "Bluetooth speakers that come and go", Review Focus 1). Both Bluetooth-output
# hosts run this role: nightstand (jbl) and the hub (vizio).
#
# The keepalive and its verify check pass the speaker name (derived from this
# host's output.speaker); the address is the household's and is read from
# local.yml on the device. Service steps are gated on common_systemd_init so the
# CI container apply stays green.

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the speaker keepalive verify check
  ansible.builtin.template:
    src: bt_speaker-verify.sh.j2
    dest: /etc/snaphouse/verify.d/bt_speaker.sh
    owner: root
    group: root
    mode: "0755"

- name: Ensure the systemd unit directory exists
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the speaker keepalive service unit
  ansible.builtin.template:
    src: snaphouse-bt-keepalive.service.j2
    dest: /etc/systemd/system/snaphouse-bt-keepalive.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for bt_speaker

- name: Install the speaker keepalive timer unit
  ansible.builtin.copy:
    src: snaphouse-bt-keepalive.timer
    dest: /etc/systemd/system/snaphouse-bt-keepalive.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for bt_speaker

# Make the units known before enabling the timer on a first install. The handler
# is gated on systemd, so this is a no-op in the CI container.
- name: Reload systemd now if the units changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the speaker keepalive timer
  ansible.builtin.systemd_service:
    name: snaphouse-bt-keepalive.timer
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service

# Run the keepalive once now, so snapclient's state matches the speaker before
# `snaphouse verify` runs at the end of this apply. Without it, a just-applied
# host would wait up to 30 s for the first timer tick, and verify could see a
# connected speaker with snapclient not yet started (or the reverse) and fail,
# tripping a self-update rollback. A oneshot start blocks until it finishes.
- name: Reconcile snapclient with the speaker now
  ansible.builtin.systemd_service:
    name: snaphouse-bt-keepalive.service
    state: started
  when: common_systemd_init
  tags:
    - service

# Speaker buttons: the speaker's play, pause, next and previous (AVRCP key presses)
# control the phone through the Bluetooth stream. Same gate as the keepalive.
- name: Create the speaker buttons group
  ansible.builtin.group:
    name: snaphouse-avrcp
    system: true

- name: Create the speaker buttons user
  # Unprivileged, no login. The unit adds the input group (SupplementaryGroups) so
  # the user can read /dev/input; it needs nothing else.
  ansible.builtin.user:
    name: snaphouse-avrcp
    group: snaphouse-avrcp
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install the speaker buttons service unit
  ansible.builtin.template:
    src: snaphouse-avrcp-keys.service.j2
    dest: /etc/systemd/system/snaphouse-avrcp-keys.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for bt_speaker

- name: Reload systemd now if the speaker buttons unit changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the speaker buttons service
  ansible.builtin.systemd_service:
    name: snaphouse-avrcp-keys.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service
