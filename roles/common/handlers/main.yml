---
# avahi-daemon reads /etc/avahi/avahi-daemon.conf only at start, so a change to
# the mDNS advertise settings takes effect on a restart, and only when the file
# changed. The handler touches a running service, so it runs only where systemd
# is PID 1 (a real machine), never in the CI container; a notified handler
# ignores --skip-tags, so the gate is the when:, and the service tag still marks
# it for a real-host --skip-tags service run.
- name: Restart avahi-daemon
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    state: restarted
  when: common_systemd_init
  tags:
    - service

# NetworkManager re-reads conf.d on reload, so the Wi-Fi power save drop-in takes
# effect for the next connection without dropping the current one. Like the
# avahi restart it touches a running service, so it runs only where systemd is
# PID 1, never in the CI container.
- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded
  when: common_systemd_init
  tags:
    - service

# Daemon-reload for the Wi-Fi watchdog units.
- name: Reload systemd for common
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: common_systemd_init
  tags:
    - service

# Apply the persistent journal without a reboot: create the directory with the
# right group and ACLs, restart journald so it reads the drop-in, then move the
# in-memory journal onto disk.
- name: Apply the persistent journal
  ansible.builtin.shell: |
    set -e
    systemd-tmpfiles --create --prefix /var/log/journal
    systemctl restart systemd-journald
    journalctl --flush
  changed_when: true
  when: common_systemd_init
  tags:
    - service
