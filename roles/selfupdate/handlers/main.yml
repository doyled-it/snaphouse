---
- name: Reload systemd and restart the self-update timer
  ansible.builtin.systemd_service:
    name: snaphouse-update.timer
    state: restarted
    daemon_reload: true
  # A notified handler ignores --skip-tags, so the gate is the when: it runs only
  # where systemd is PID 1, never in the CI container. The service tag still marks
  # it as a service action for a real-host --skip-tags service run.
  when: common_systemd_init
  tags:
    - service
