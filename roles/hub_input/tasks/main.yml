---
# The hub's audio inputs. Only `house` runs this role. It brings up the two
# ways audio reaches the house and the Snapcast server that mixes them:
#
#   - AirPlay: a standalone shairport-sync (snaphouse-airplay-in) plays into the
#     ALSA loopback with soxr rate matching; snapserver captures the other end as
#     its "AirPlay" source. Apple devices see one receiver named "House"; a
#     control script turns shairport's metadata pipe into stream properties.
#   - Bluetooth: the phone's A2DP audio is decoded by bluealsa-aplay into the
#     ALSA loopback; snapserver captures the other end of the loopback. The
#     phone's AVRCP volume is applied to the audio here (--volume=software), so
#     the whole house attenuates together.
#   - snapserver itself, installed from the pinned release .deb, with a meta
#     stream named "House" in front of the two inputs.
#
# Hardware (module load) and service (start/restart) steps are tagged and gated
# on common_systemd_init so the CI container apply stays green.

- name: Install shairport-sync for the AirPlay source
  ansible.builtin.apt:
    name: shairport-sync
    state: present
    update_cache: true
    cache_valid_time: 3600

# The hub runs its own shairport-sync (snaphouse-airplay-in.service) for the
# AirPlay input, so the packaged standalone service must not also hold the
# AirPlay name and RTSP port.
- name: Stop and mask the standalone shairport-sync service
  ansible.builtin.systemd_service:
    name: shairport-sync.service
    state: stopped
    masked: true
  when: common_systemd_init
  tags:
    - service

# The pinned snapserver .deb, installed by the shared snapcast_pkg role (the
# same one snapclient uses for its package) so there is one source of truth for
# how a Snapcast release lands. The version and checksums are in vars/all.yml.
- name: Install the pinned snapserver release
  ansible.builtin.include_role:
    name: snapcast_pkg
  vars:
    snapcast_pkg_name: snapserver
    snapcast_pkg_sha256: "{{ snapcast_server_sha256 }}"

- name: Load the ALSA loopback module at boot
  ansible.builtin.copy:
    content: "snd-aloop\n"
    dest: /etc/modules-load.d/snaphouse-aloop.conf
    owner: root
    group: root
    mode: "0644"
  notify: Load configured kernel modules

- name: Ensure the ALSA system config drop-in dir exists
  ansible.builtin.file:
    path: /etc/alsa/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Bluetooth loopback ALSA device
  ansible.builtin.template:
    src: snaphouse-btloop.conf.j2
    dest: /etc/alsa/conf.d/99-snaphouse-btloop.conf
    owner: root
    group: root
    mode: "0644"
  # bluealsa-aplay reads this at start, so pick up a format change on restart.
  notify: Restart the Bluetooth input

- name: Install the AirPlay loopback ALSA device
  ansible.builtin.template:
    src: snaphouse-airplay-loop.conf.j2
    dest: /etc/alsa/conf.d/99-snaphouse-airplay-loop.conf
    owner: root
    group: root
    mode: "0644"
  # shairport-sync opens this device at start, so pick up a change on restart.
  notify: Restart the AirPlay input

- name: Install the Bluetooth-input service unit
  ansible.builtin.copy:
    src: snaphouse-bt-in.service
    dest: /etc/systemd/system/snaphouse-bt-in.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for hub input
    - Restart the Bluetooth input

- name: Write the shairport-sync configuration for the AirPlay input
  ansible.builtin.template:
    src: snaphouse-airplay.conf.j2
    dest: /etc/snaphouse/shairport-airplay.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the AirPlay input

- name: Install the AirPlay-input service unit
  ansible.builtin.copy:
    src: snaphouse-airplay-in.service
    dest: /etc/systemd/system/snaphouse-airplay-in.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for hub input
    - Restart the AirPlay input

# The AirPlay metadata bridge downscales cover art and writes it here; nginx
# serves this directory (under the web root) at /cover/. snapserver runs the
# bridge as the AirPlay stream's control script, so the directory is owned by the
# snapserver user it writes as.
- name: Ensure the cover-art directory exists
  ansible.builtin.file:
    path: /var/lib/snaphouse/public/cover
    state: directory
    owner: snapserver
    group: snapserver
    mode: "0755"

- name: Write the snapserver configuration
  ansible.builtin.template:
    src: snapserver.conf.j2
    dest: /etc/snapserver.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart snapserver

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the hub-input verify check
  ansible.builtin.copy:
    src: verify.d/hub_input.sh
    dest: /etc/snaphouse/verify.d/hub_input.sh
    owner: root
    group: root
    mode: "0755"

# Make the units and module config known before enabling things on a first
# install. The handlers are gated on systemd, so this is a no-op in CI.
- name: Reload systemd and load modules now if anything changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Bluetooth input
  ansible.builtin.systemd_service:
    name: snaphouse-bt-in.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service

- name: Enable and start the AirPlay input
  ansible.builtin.systemd_service:
    name: snaphouse-airplay-in.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service

- name: Enable and start snapserver
  ansible.builtin.systemd_service:
    name: snapserver.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service
