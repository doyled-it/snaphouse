# Managed by snaphouse (hub_input role). Do not edit by hand.
#
# Now-playing cover art, written by the AirPlay metadata bridge
# (lib/snaphouse/airplay_meta.py) to /var/lib/snaphouse/public/cover and named by
# content hash. This drops into the web role's include dir (/etc/nginx/snaphouse.d)
# on the hub. It is needed because the room-picker's `location /` sets its own
# root (the room-picker site), which would otherwise shadow /cover/ and 404 it;
# this more-specific prefix location serves the files from the public web root.
# The names are content-addressed and immutable, so cache them hard.
location /cover/ {
    root /var/lib/snaphouse/public;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
