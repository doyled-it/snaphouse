---
# Where this host clones the homebody repo from on first boot. It defaults to the
# real public repo; the container test overrides it with a local stub so the
# bootstrap can be exercised with no network and no real thermostat.
homebody_bootstrap_repo_url: "https://github.com/doyled-it/homebody"

# Where the daemon writes its status file; the directory is owned by the homebody
# user. nginx serves it as /homebody.json. Never chown the public root above it.
homebody_bootstrap_status_dir: /var/lib/snaphouse/public/homebody
