---
# First-boot bootstrap of homebody on the hub (design "Deployment", the homebody
# spec). snaphouse installs the OS base and audio, then installs homebody: it
# clones the repo and runs homebody's own installer once, which ensures the
# homebody user, the local config from the example, the state directory, and the
# uv venv. From then on homebody self-updates on the timer this role installs, so
# this role never re-touches a homebody-owned path. Both the clone and the
# installer are guarded by creates for exactly that reason; the git module is
# deliberately not used, since it would reach into the checkout on every apply.
#
# Unlike nightstand (which owns its own units), the systemd units homebody runs
# under live here as templates: the Matter controller and the self-update service
# and timer. The install interface the two repos share pins that split.

# git for the clone; iputils-arping for homebody's Wi-Fi presence probe (arping
# is not in a default Debian install, and without it nobody is ever seen home).
- name: Ensure git and the presence probe tools are present
  ansible.builtin.apt:
    name:
      - git
      - iputils-arping
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone homebody on first boot only
  ansible.builtin.command:
    cmd: "git clone {{ homebody_bootstrap_repo_url }} /opt/homebody"
    creates: /opt/homebody
  # Deliberately the command module with a creates guard, not ansible.builtin.git:
  # snaphouse clones once and must never re-touch homebody-owned paths after.
  # noqa command-instead-of-module

- name: Run the homebody installer once
  # homebody's installer is idempotent, runs as root, and creates the homebody
  # user, /etc/homebody/local.toml from its example, /var/lib/homebody, and the uv
  # venv. It writes the update state file only at the very end of a successful
  # install, so that file is the guard: a first run that fails partway (after
  # local.toml exists) is retried on the next apply. Once it succeeds snaphouse
  # never runs it again; homebody self-updates from then on.
  ansible.builtin.command:
    cmd: ./deploy/install.sh
    chdir: /opt/homebody
    creates: /var/lib/homebody/update/update.state

- name: Create the CHIP /data directory the Matter unit binds onto /data
  ansible.builtin.file:
    path: /var/lib/homebody/chip-data
    state: directory
    owner: homebody
    group: homebody
    mode: "0750"

- name: Create the PAA root certificate directory for the Matter controller
  ansible.builtin.file:
    path: /var/lib/homebody/paa-root-certs
    state: directory
    owner: homebody
    group: homebody
    mode: "0750"

- name: Ensure the systemd unit directory exists
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the homebody Matter controller unit
  ansible.builtin.template:
    src: homebody-matter.service.j2
    dest: /etc/systemd/system/homebody-matter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for homebody_bootstrap
    - Restart the homebody Matter controller

- name: Install the homebody self-update service unit
  ansible.builtin.template:
    src: homebody-update.service.j2
    dest: /etc/systemd/system/homebody-update.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for homebody_bootstrap

- name: Install the homebody self-update timer unit
  ansible.builtin.template:
    src: homebody-update.timer.j2
    dest: /etc/systemd/system/homebody-update.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for homebody_bootstrap
    - Restart the homebody update timer

- name: Install the homebody daemon unit
  ansible.builtin.template:
    src: homebody.service.j2
    dest: /etc/systemd/system/homebody.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for homebody_bootstrap
    - Restart the homebody daemon

# The daemon's own status directory under the public root, owned by homebody so
# the unprivileged daemon can write its file there. Only this subdirectory: the
# shared public root belongs to the web role and is never chowned from here.
- name: Create the homebody status directory owned by homebody
  ansible.builtin.file:
    path: "{{ homebody_bootstrap_status_dir }}"
    state: directory
    owner: homebody
    group: homebody
    mode: "0755"

- name: Install the homebody nginx routes
  # Drops into the web role's include dir as its own file.
  ansible.builtin.template:
    src: homebody.conf.j2
    dest: /etc/nginx/snaphouse.d/homebody.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx for homebody_bootstrap

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the homebody verify check
  ansible.builtin.copy:
    src: verify.d/homebody.sh
    dest: /etc/snaphouse/verify.d/homebody.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the homebody daemon verify check
  ansible.builtin.copy:
    src: verify.d/homebody_status.sh
    dest: /etc/snaphouse/verify.d/homebody_status.sh
    owner: root
    group: root
    mode: "0755"

# Flush the reload handler now so the units are known before we enable them on a
# first install. The handlers are gated on systemd, so this is a no-op in the CI
# container.
- name: Reload systemd now if the units changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the homebody Matter controller
  ansible.builtin.systemd_service:
    name: homebody-matter.service
    enabled: true
    state: started
  # Only on a real systemd host; the CI container has no running init, so the
  # service is never started there (see common_systemd_init in the common role).
  when: common_systemd_init
  tags:
    - service

- name: Enable and start the homebody self-update timer
  ansible.builtin.systemd_service:
    name: homebody-update.timer
    enabled: true
    state: started
  # Only on a real systemd host; the CI container has no running init.
  when: common_systemd_init
  tags:
    - service

# Started only on a real systemd host (the CI container has no init, so the unit
# never starts there and a stub /opt/homebody without `homebody run` cannot fail
# the play).
- name: Enable and start the homebody daemon
  ansible.builtin.systemd_service:
    name: homebody.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service
