---
# Every handler touches a running service, so each is gated on common_systemd_init
# (real machine only) and tagged service. A notified handler ignores --skip-tags,
# so the when: is what keeps these out of the CI container; the tag still marks
# them for a real-host --skip-tags service run.

# Defined before the restart handlers so a daemon-reload runs first when both a
# reload and a restart are notified on a unit change.
- name: Reload systemd for panel
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: common_systemd_init
  tags:
    - service

- name: Restart the kiosk service
  ansible.builtin.systemd_service:
    name: snaphouse-kiosk.service
    state: restarted
  when: common_systemd_init
  tags:
    - service

- name: Restart the backlight service
  ansible.builtin.systemd_service:
    name: snaphouse-backlight.service
    state: restarted
  when: common_systemd_init
  tags:
    - service
