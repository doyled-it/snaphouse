# Managed by snaphouse (art_share role). Do not edit by hand.
#
# The read-only side of the hub's art folder: a JSON directory listing that
# pi-bedroom (nightstand) pulls from over the LAN. The writable side is the SMB
# 'art' share; this exposes the same folder read-only. The JSON shape is the
# pinned "Art listing" contract in docs/cross-repo-features.md.
#
# This drops into the web role's include dir (/etc/nginx/snaphouse.d), so it is a
# location block for the server the web role already defines. It lives in its own
# include to stay clear of the room-picker locations, which land in the same dir.
location /art/ {
    alias /srv/snaphouse/art/;
    autoindex on;
    autoindex_format json;
}
