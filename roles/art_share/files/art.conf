# Managed by snaphouse (art_share role). Do not edit by hand.
#
# The hub's art surface on the LAN, all served by the server block the web role
# owns (this drops into /etc/nginx/snaphouse.d). LAN-only: there is no inbound
# access from the internet (AGENTS.md).
#
#   /art/            the read-only JSON directory listing of the art folder (the
#                    pinned "Art listing" contract), the frame's old sync source.
#   /api/art/        the admin API, proxied to the loopback art admin service.
#   /art-index.json  the richer library index the service publishes.
#   /art-control.json the rotation settings and last command the service publishes.
#   /art-thumbs/     the thumbnails the service writes.
#
# The service (snaphouse-artadmin) writes the two JSON documents and the
# thumbnails into subdirectories it owns under the public root, never the
# root-owned public root itself, so re-owning never fights the web role (the
# art-share idempotency gate). The exact-match document locations point their
# root at the art-owned docs subdir; the thumbnails are served from the public
# root, where the service's own art-thumbs subdir sits.

# The read-only JSON listing of the art folder. The writable side is the SMB
# 'art' share; this exposes the same folder read-only. The JSON shape is the
# pinned "Art listing" contract in docs/cross-repo-features.md.
location /art/ {
    alias /srv/snaphouse/art/;
    autoindex on;
    autoindex_format json;
}

# The admin API, proxied to the art admin service on loopback. The upload cap
# matches the service's own 25 MB per-file limit plus multipart overhead, so an
# oversized upload is rejected at the edge before it reaches the service.
location /api/art/ {
    proxy_pass http://127.0.0.1:8781;
    proxy_set_header Host $host;
    client_max_body_size 26m;
}

# The published library index, written by the service into the art-owned docs
# subdir. Exact-match so it outranks the room-picker `location /` prefix, served
# same-origin to the page and read by the nightstand frame. The service writes it
# at startup, so it exists even before the first change.
location = /art-index.json {
    root /var/lib/snaphouse/public/art;
    default_type application/json;
}

# The rotation settings and last command, written by the service into the same
# art-owned docs subdir, same exact-match reasons. The frame reads it each cycle.
location = /art-control.json {
    root /var/lib/snaphouse/public/art;
    default_type application/json;
}

# The thumbnails the service writes into its art-thumbs subdir of the public
# root. A prefix location (the page and the frame request individual thumbs by
# name), served straight from the public root.
location /art-thumbs/ {
    root /var/lib/snaphouse/public;
}
