<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>House</title>
    <meta name="description" content="Turn each room on or off and set its volume." />
    <meta name="theme-color" content="#111417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="House" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="house">House</h1>
    </header>

    <section id="np-card" class="np-card" aria-label="Now playing" hidden>
      <div class="np-art">
        <img id="np-art-img" class="np-art-img" alt="" hidden />
        <div id="np-art-ph" class="np-art-ph" aria-hidden="true"></div>
      </div>
      <div class="np-info">
        <p id="np-title" class="np-title"></p>
        <p id="np-artist" class="np-artist" hidden></p>
        <p id="np-album" class="np-album" hidden></p>
        <div id="np-progress" class="np-progress" hidden>
          <div class="np-track"><div id="np-fill" class="np-fill"></div></div>
          <div class="np-times">
            <span id="np-elapsed" class="np-elapsed"></span>
            <span id="np-ends" class="np-ends" hidden></span>
          </div>
        </div>
        <p id="np-status" class="np-status" hidden>Paused</p>
      </div>
    </section>

    <p id="health" class="health" role="status" hidden></p>
    <p id="connection" class="connection" role="status" hidden></p>

    <main id="rooms" class="rooms"></main>

    <section id="np-history" class="art" aria-labelledby="np-history-heading" hidden>
      <h2 id="np-history-heading" class="art-heading">Recently played</h2>
      <ul id="np-history-list" class="art-history"></ul>
    </section>

    <section id="art" class="art" aria-labelledby="art-heading" hidden>
      <h2 id="art-heading" class="art-heading">On the frame</h2>
      <div id="art-current" class="art-current"></div>

      <div id="art-nowshowing" class="art-nowshowing" hidden>
        <div class="art-nav">
          <button id="art-back" class="art-btn" type="button">Back</button>
          <button id="art-next" class="art-btn" type="button">Next</button>
        </div>
        <p class="art-redraw-note">The frame is e-ink; a change takes a few seconds to redraw.</p>
      </div>

      <p id="art-message" class="art-message" role="status" hidden></p>

      <div id="art-manager" class="art-manager" hidden>
        <div class="art-rotation">
          <p id="art-rotation-summary" class="art-rotation-summary"></p>
          <label class="art-interval-label">Change every
            <select id="art-interval" class="art-select"></select>
          </label>
          <div class="art-chips-wrap">
            <span class="art-chips-label">In rotation</span>
            <div id="art-folder-chips" class="art-chips" role="group" aria-label="Folders in rotation"></div>
          </div>
        </div>

        <div class="art-library">
          <div class="art-library-head">
            <h3 class="art-subheading">Library</h3>
            <label class="art-filter-label">Show
              <select id="art-folder-filter" class="art-select"></select>
            </label>
          </div>
          <ul id="art-grid" class="art-grid"></ul>
          <p id="art-grid-empty" class="art-empty" hidden>No pieces here yet.</p>
        </div>

        <div class="art-upload">
          <h3 class="art-subheading">Add art</h3>
          <div class="art-upload-row">
            <label class="art-upload-folder-label">Add to
              <select id="art-upload-folder" class="art-select"></select>
            </label>
            <label class="art-btn art-upload-btn">
              Choose images
              <input id="art-upload-input" class="art-upload-input" type="file" accept="image/*" multiple />
            </label>
          </div>
          <ul id="art-upload-progress" class="art-upload-progress"></ul>
        </div>

        <details id="art-folders" class="art-folders">
          <summary class="art-subheading">Folders</summary>
          <form id="art-folder-create" class="art-folder-create">
            <input id="art-folder-name" class="art-text" type="text" placeholder="New folder name"
                   maxlength="40" aria-label="New folder name" />
            <button class="art-btn" type="submit">Create</button>
          </form>
          <ul id="art-folder-list" class="art-folder-list"></ul>
        </details>

        <details id="art-trash" class="art-trash">
          <summary class="art-subheading">Trash</summary>
          <ul id="art-trash-list" class="art-trash-list"></ul>
          <p id="art-trash-empty" class="art-empty" hidden>Trash is empty.</p>
        </details>
      </div>

      <h3 id="art-recent-heading" class="art-recent-heading" hidden>Recently shown</h3>
      <ul id="art-history" class="art-history"></ul>
    </section>

    <script type="module" src="rooms.js"></script>
  </body>
</html>
