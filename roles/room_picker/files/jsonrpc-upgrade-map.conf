# Managed by snaphouse (room_picker role). Do not edit by hand.
#
# A map in nginx's http context, so it cannot live in the per-server include dir
# the web role uses. It drives the Connection header of the /jsonrpc proxy: send
# "upgrade" when the client asked to upgrade (the WebSocket notification socket),
# and "close" for a plain JSON-RPC POST, which must not carry an upgrade header.
map $http_upgrade $snaphouse_connection_upgrade {
    default upgrade;
    ''      close;
}
