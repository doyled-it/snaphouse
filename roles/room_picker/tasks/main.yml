---
# The room picker: a small static page served from the hub on the LAN. It shows
# one on/off toggle and a volume slider per room, what is playing, and a health
# line per machine. It talks to snapserver over the /jsonrpc proxy (a WebSocket
# for live updates, a 5 s poll as fallback).
#
# This role is in the hub's roles list only, so the page and the JSON-RPC proxy
# exist only where snapserver runs. Everything here is file config plus an nginx
# reload; the reload handler (web role) is gated on a real systemd host, so the
# CI container applies this cleanly.

- name: Ensure the room picker web root exists
  ansible.builtin.file:
    path: /var/lib/snaphouse/room-picker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the room picker static site
  ansible.builtin.copy:
    src: site/
    dest: /var/lib/snaphouse/room-picker/
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Write the room list and health targets from the inventory
  ansible.builtin.template:
    src: rooms.json.j2
    dest: /var/lib/snaphouse/room-picker/rooms.json
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install the room picker nginx locations
  ansible.builtin.template:
    src: room_picker.conf.j2
    dest: /etc/nginx/snaphouse.d/room_picker.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install the JSON-RPC WebSocket upgrade map
  ansible.builtin.copy:
    src: jsonrpc-upgrade-map.conf
    dest: /etc/nginx/conf.d/snaphouse-jsonrpc.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the room picker verify check
  ansible.builtin.copy:
    src: verify.d/room_picker.sh
    dest: /etc/snaphouse/verify.d/room_picker.sh
    owner: root
    group: root
    mode: "0755"
