---
# Track metadata for the hub's streams. Only `house` runs this role, after
# hub_input. It wires the two control scripts snapserver runs:
#   - lib/snaphouse/avrcp_meta.py for the "Bluetooth" stream (AVRCP over D-Bus);
#   - lib/snaphouse/airplay_meta.py for the "AirPlay" stream (shairport-sync's
#     metadata pipe, publishing a downscaled cover URL, never inline artData).
#
# Both ship in the repo checkout at /opt/snaphouse and carry a shebang that
# points at the on-device uv venv, so snapserver runs them with the interpreter
# that has their dependencies (jeepney for Bluetooth; Pillow, the hub-only extra,
# for the AirPlay cover downscale). This role makes each script executable and
# restarts snapserver when its contents change, so an updated mapping takes
# effect on the next self-update rather than waiting for a reboot. The "Restart
# snapserver" handler is defined in roles/hub_input.
#
# The /opt/snaphouse tasks are gated on common_systemd_init: that path is the
# on-device checkout, absent in the CI container where the repo is read-only
# elsewhere. The verify check is installed unconditionally; it only runs under
# `snaphouse verify` on a real machine.

- name: Ensure the verify.d dir exists for on-device check scripts
  ansible.builtin.file:
    path: /etc/snaphouse/verify.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the metadata verify check
  ansible.builtin.copy:
    src: verify.d/metadata.sh
    dest: /etc/snaphouse/verify.d/metadata.sh
    owner: root
    group: root
    mode: "0755"

# The now-playing service (snaphouse-nowplaying) follows the House stream and
# publishes now-playing.json and play-history.json into the public web root, with
# background cover lookups. It runs as the snapserver user so it can write the
# cover directory the AirPlay bridge owns (cover/lookup, cover/history). The two
# JSON files sit in the public root itself, so the service needs to write there;
# owning the directory grants exactly that without widening the mode for group or
# other. root (the status timers) still writes regardless of ownership. The
# snapserver user and the cover dir are created by hub_input, which runs first.
- name: Let the now-playing service write the public web root
  ansible.builtin.file:
    path: /var/lib/snaphouse/public
    state: directory
    owner: snapserver
    group: snapserver
    mode: "0755"

- name: Install the now-playing service unit
  ansible.builtin.template:
    src: snaphouse-nowplaying.service.j2
    dest: /etc/systemd/system/snaphouse-nowplaying.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for metadata
    - Restart the now-playing service

- name: Install the now-playing verify check
  ansible.builtin.copy:
    src: verify.d/nowplaying.sh
    dest: /etc/snaphouse/verify.d/nowplaying.sh
    owner: root
    group: root
    mode: "0755"

- name: Ensure the control scripts are executable
  ansible.builtin.file:
    path: "/opt/snaphouse/lib/snaphouse/{{ item }}"
    mode: "0755"
  loop:
    - avrcp_meta.py
    - airplay_meta.py
  when: common_systemd_init
  notify: Restart snapserver

- name: Record each control script digest so snapserver restarts when it changes
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', '/opt/snaphouse/lib/snaphouse/' ~ item) | hash('sha1') }}\n"
    dest: "/etc/snaphouse/{{ item | replace('.py', '') }}.sha1"
    owner: root
    group: root
    mode: "0644"
  loop:
    - avrcp_meta.py
    - airplay_meta.py
  when: common_systemd_init
  notify: Restart snapserver

# The now-playing service runs the code in place from /opt/snaphouse, so restart
# it when its modules change on a self-update rather than waiting for a reboot.
# nowplaying.py is the service; artlookup.py is the cover lookup it imports.
- name: Record the now-playing module digests so the service restarts when they change
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', '/opt/snaphouse/lib/snaphouse/' ~ item) | hash('sha1') }}\n"
    dest: "/etc/snaphouse/{{ item | replace('.py', '') }}.sha1"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nowplaying.py
    - artlookup.py
  when: common_systemd_init
  notify: Restart the now-playing service

# Make the unit and digests known before enabling on a first install. The
# handlers are gated on systemd, so this is a no-op in the CI container.
- name: Reload systemd now if the now-playing unit changed
  ansible.builtin.meta: flush_handlers

- name: Enable and start the now-playing service
  ansible.builtin.systemd_service:
    name: snaphouse-nowplaying.service
    enabled: true
    state: started
  when: common_systemd_init
  tags:
    - service
