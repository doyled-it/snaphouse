---
# Settings shared by every machine. Nothing identifying belongs here; that lives
# in the untracked /etc/snaphouse/local.yml. Roles read these in later tasks.

# Python on every machine is managed with uv, never apt python3-* or pip. The
# common role installs this pinned uv release from GitHub (idempotent); later
# roles run their on-device Python from a uv-synced venv off pyproject.toml and
# uv.lock. Bump this to upgrade uv across the house through the normal PR flow.
uv_version: "0.13.7"
# SHA-256 of each uv release tarball, pinned in the repo rather than fetched from
# the same origin as the download, so a tampered mirror cannot swap the artifact
# and its checksum together. Update both when bumping uv_version, from the
# release's uv-<arch>-unknown-linux-gnu.tar.gz.sha256 files.
uv_sha256:
  x86_64: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
  aarch64: "71279f8d3c67241e807b9d8db872d1bf541579fb9f08b7d1eb1682196d1e57dc"

# Self-update timer: each machine runs ansible-pull against main on this cadence,
# with a random spread so the three machines do not all wake at once.
update_interval: "15min"
update_randomized_delay: "120s"

# Automatic security updates reboot during quiet hours, staggered per machine so
# the house is never fully down at once.
reboot_times:
  house: "03:15"
  office: "03:45"
  nightstand: "04:15"
  panel: "04:45"

# Snapcast meta stream: AirPlay is listed before Bluetooth, so AirPlay wins a tie
# when both senders are active. Both the AirPlay and Bluetooth sinks advertise as
# "House".
house_stream_name: "House"
stream_priority:
  - AirPlay
  - Bluetooth

# The hub's AirPlay 2 receiver is the official shairport-sync container image
# (AirPlay 2 and NQPTP, which Debian bookworm's 3.3.8 package lacks), run by
# snaphouse-airplay-in.service. Pinned by tag and digest: the digest is what
# docker pulls, the tag is for humans. To bump, resolve the new tag's index digest
# (docker buildx imagetools inspect mikebrady/shairport-sync:<tag>) and change both.
shairport_image_repo: "mikebrady/shairport-sync"
shairport_image_tag: "5.6.3"
shairport_image_digest: "sha256:8ae074fc6ca71dc9e52789afc21e59319d878efe5b06d2ac4e9a08db78ad329c"
shairport_image: "{{ shairport_image_repo }}:{{ shairport_image_tag }}@{{ shairport_image_digest }}"
# AirPlay 2 serves RTSP on 7000 (AirPlay 1 used 5000). The verify check probes it.
airplay_rtsp_port: 7000

# The sample format every meta-stream member shares, as <rate>:<bits>:<channels>.
# snapserver fixes the AirPlay source at 44100:16:2, so the Bluetooth source and
# the meta stream must match or the House stream plays at the wrong pitch, and
# snd-aloop forces its capture rate to equal what bluealsa-aplay writes. This one
# value drives both the snapserver sources and the ALSA loopback that
# bluealsa-aplay feeds (hub_input role), so both ends of the loopback and every
# meta member agree. The hub_input verify check asserts snapserver reports it.
house_sample_format: "44100:16:2"

# The hub's loopback port for the web pairing service (hub_pairing role,
# snaphouse-pairing.service). It serves the /api/pair/ window API nginx proxies on
# the hub, bound to 127.0.0.1 only. 8781 is the art admin service; pairing takes
# the next port. Pinned here so the unit and the nginx proxy agree on one value.
pairing_port: 8782

# The loopback port homebody's daemon serves its settings API on (homebody config
# [api] port). nginx proxies /api/homebody/ here; shared with the homebody role.
homebody_api_port: 8783

# Idle threshold for the two alsa inputs, in milliseconds. snapserver's default
# (100 ms) treats the digital silence between spoken sentences as the stream
# stopping, which flaps the House meta stream and chops every room during
# audiobooks and podcasts (issue #90). Ten seconds keeps speech pauses as
# playing while a real stop still goes idle. The hub_input template applies this
# to both the AirPlay and Bluetooth sources.
snapserver_idle_threshold_ms: 10000

# Bluetooth input receive buffer (hub_input role, snaphouse-bt-in.service). Issue
# #92: a phone streaming A2DP briefly pauses its sender when it buffers ahead
# (seen on a downloaded audiobook), and the default loopback buffer ran dry during
# those stalls, so the house skipped in every room. The buffer was raised to
# 1.5 s for that. A later hand test on the hub at 500 ms with a 100 ms period
# kept video in sync with the phone, the owner heard no skips, and the hub logged
# 3 underruns in about 9 hours, so the buffer is 500 ms. Times are in
# microseconds, the units bluealsa-aplay expects. Cost: about 0.5 s of delay
# between the phone and the speakers.
bt_input_buffer_time_us: 500000
bt_input_period_time_us: 100000

# Control-panel backlight schedule (panel role, snaphouse-backlight.service). The
# panel's official DSI display dims to a low level during quiet hours and wakes to
# full on a touch, returning to the low level after dim_timeout_s idle; full the
# rest of the day. Levels are percentages of the panel's max brightness. The
# quiet-hours window mirrors the house default (22:00 to 06:00) and is kept here so
# the panel's backlight is self-contained: it never has to reach the hub at boot to
# know when to dim, which matters after a power cut. tests/python/test_backlight.py
# pins the schedule logic.
panel_backlight:
  full_pct: 100
  dim_pct: 15
  dim_timeout_s: 60
  quiet_start: "22:00"
  quiet_end: "06:00"

# Pinned Snapcast release. Chosen as the newest release (v0.35.0, 2026-03-10) that
# supports everything the hub needs: the meta stream (meta:// priority/merge
# source), the airplay source with track metadata and cover art, and stream
# control scripts (the controlscript parameter and the Plugin.Stream.Player.*
# JSON-RPC API). All three are documented for this release at
# https://github.com/badaix/snapcast/blob/v0.35.0/doc/configuration.md and
# .../doc/json_rpc_api/stream_plugin.md . snapserver is installed from the
# release .debs on GitHub for the host architecture; snapclient lands on the Pis
# in Task 6, so the install role is arch-aware now.
snapcast_version: "0.35.0"

# The release .deb for each machine is chosen by that machine's own Debian
# codename at apply time (ansible_distribution_release), not a single value for
# the whole house: the hub runs Debian bookworm (amd64) and the Raspberry Pis run
# Debian trixie (arm64), and a bookworm .deb does not satisfy its shared-library
# dependencies on trixie (libflac12 vs libflac14). The snapcast_pkg role fails
# with a clear message if a machine's (codename, arch) has no pinned checksum in
# the maps below. The .deb filename is
# snap{server,client}_<version>-1_<arch>_<codename>.deb.

# SHA-256 of each snapserver/snapclient release .deb, keyed by Debian codename
# then by .deb architecture, pinned in the repo rather than fetched from the
# download origin so a tampered mirror cannot swap the artifact and its checksum
# together (same rule as uv_sha256 above). These are the plain (no
# pipewire/pulse) assets of the v0.35.0 release
# (https://github.com/badaix/snapcast/releases/tag/v0.35.0), each verified with
# `sha256sum` on the downloaded asset. The pinned (codename, arch) pairs are the
# ones the fleet uses: bookworm/amd64 (the hub) and trixie/arm64 (the Raspberry
# Pis), plus trixie/amd64 (the hub should it ever move to trixie) and
# bookworm/arm64 so the container apply check stays green whether its runner is
# amd64 or arm64 (an arm64 host pulls the arm64 base image). Add a pair here (in
# both maps) before a machine on a new codename or arch can apply, and update
# every value when bumping snapcast_version. tests/python/test_snapcast_pkg.py
# asserts each supported pair is present in both maps.
snapcast_server_sha256:
  bookworm:
    amd64: "afb012318bb8cbf82c63c2084de3b290f53108c49976ff364100882cd8816b41"
    arm64: "526cded407fad5940e834d77cf66a3b7ebac68931a530be55179f60d327044fd"
  trixie:
    amd64: "6a82325cf9eae68b75fb062491639cb31ec58288fe8930f53e86689e22a095da"
    arm64: "be0c94ea3551c4ba4f4e5f810b18f6c85d9794ab32e4fc6c5e6886e096490914"
snapcast_client_sha256:
  bookworm:
    amd64: "b71575bcc2b4541f5004c73a0a1f43374e852bf5d5f2162aa1b230f3c209d9f3"
    arm64: "83afa0910cce99c0e6d4a52ec1849240c9956f5147e0743d60d4dd5f3b11af1a"
  trixie:
    amd64: "3c699b5800904534c10f4a68d0a8736035d8c4b8d8a93ab05a14d4dcae0f04a5"
    arm64: "eced4134eeab132fc16af23ce19eb2f81abe23dd0f3c610150fb3bd1d344efae"
