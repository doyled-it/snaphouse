---
# Settings shared by every machine. Nothing identifying belongs here; that lives
# in the untracked /etc/snaphouse/local.yml. Roles read these in later tasks.

# Python on every machine is managed with uv, never apt python3-* or pip. The
# common role installs this pinned uv release from GitHub (idempotent); later
# roles run their on-device Python from a uv-synced venv off pyproject.toml and
# uv.lock. Bump this to upgrade uv across the house through the normal PR flow.
uv_version: "0.13.7"
# SHA-256 of each uv release tarball, pinned in the repo rather than fetched from
# the same origin as the download, so a tampered mirror cannot swap the artifact
# and its checksum together. Update both when bumping uv_version, from the
# release's uv-<arch>-unknown-linux-gnu.tar.gz.sha256 files.
uv_sha256:
  x86_64: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
  aarch64: "71279f8d3c67241e807b9d8db872d1bf541579fb9f08b7d1eb1682196d1e57dc"

# Self-update timer: each machine runs ansible-pull against main on this cadence,
# with a random spread so the three machines do not all wake at once.
update_interval: "15min"
update_randomized_delay: "120s"

# Automatic security updates reboot during quiet hours, staggered per machine so
# the house is never fully down at once.
reboot_times:
  zimablade: "03:15"
  pi-office: "03:45"
  pi-bedroom: "04:15"

# Snapcast meta stream: AirPlay is listed before Bluetooth, so AirPlay wins a tie
# when both senders are active. Both the AirPlay and Bluetooth sinks advertise as
# "House".
house_stream_name: "House"
stream_priority:
  - AirPlay
  - Bluetooth

# The sample format every meta-stream member shares, as <rate>:<bits>:<channels>.
# snapserver fixes the AirPlay source at 44100:16:2, so the Bluetooth source and
# the meta stream must match or the House stream plays at the wrong pitch, and
# snd-aloop forces its capture rate to equal what bluealsa-aplay writes. This one
# value drives both the snapserver sources and the ALSA loopback that
# bluealsa-aplay feeds (hub_input role), so both ends of the loopback and every
# meta member agree. The hub_input verify check asserts snapserver reports it.
house_sample_format: "44100:16:2"

# Pinned Snapcast release. Chosen as the newest release (v0.35.0, 2026-03-10) that
# supports everything the hub needs: the meta stream (meta:// priority/merge
# source), the airplay source with track metadata and cover art, and stream
# control scripts (the controlscript parameter and the Plugin.Stream.Player.*
# JSON-RPC API). All three are documented for this release at
# https://github.com/badaix/snapcast/blob/v0.35.0/doc/configuration.md and
# .../doc/json_rpc_api/stream_plugin.md . snapserver is installed from the
# release .debs on GitHub for the host architecture; snapclient lands on the Pis
# in Task 6, so the install role is arch-aware now.
snapcast_version: "0.35.0"

# The Debian codename of the release .deb to install. The hub runs Debian; this
# is its codename. Bump it (and the checksums below) if the hub is moved to a
# newer Debian. The .deb filename is snap{server,client}_<version>-1_<arch>_<codename>.deb.
snapcast_deb_distro: "bookworm"

# SHA-256 of each snapserver release .deb, pinned in the repo rather than fetched
# from the download origin, so a tampered mirror cannot swap the artifact and its
# checksum together (same rule as uv_sha256 above). These are the plain
# snapserver_0.35.0-1_<arch>_bookworm.deb assets. Update all of these when
# bumping snapcast_version or snapcast_deb_distro; compute them by downloading the
# release asset and running sha256sum.
snapcast_server_sha256:
  amd64: "afb012318bb8cbf82c63c2084de3b290f53108c49976ff364100882cd8816b41"
  arm64: "526cded407fad5940e834d77cf66a3b7ebac68931a530be55179f60d327044fd"
