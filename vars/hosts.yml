---
# Which roles each machine applies, and its per-room settings.
#
# A machine finds itself here by hostname (snaphouse_host, defaulting to the
# machine's hostname). site.yml applies hosts[snaphouse_host].roles in order.
# The first three roles are always common, web, selfupdate: base OS config, the
# status page, and the self-update timer. Everything identifying stays out of
# this file and lives in the untracked /etc/snaphouse/local.yml.
#
# output.kind:    alsa (wired or USB card) or bluetooth (A2DP to a speaker)
# output.device:  ALSA device/card name, or null when not applicable
# output.speaker: vizio, jbl, or null (which paired speaker, address in local.yml)
# latency_ms:     per-room playback offset, tuned in Snapweb (Task 10); starts at 0
#
# The key is snaphouse_hosts, not 'hosts': 'hosts' is an Ansible reserved
# keyword and fails ansible-lint.
snaphouse_hosts:
  house:
    roles:
      - common
      - web
      - selfupdate
      - bluetooth
      - hub_input
      - metadata
      - snapclient
      - bt_speaker
      - room_picker
      - art_share
      - homebody_bootstrap
    room_label: "Living room"
    host_id: living
    output:
      kind: bluetooth
      device: null
      speaker: vizio
    # The Vizio's Bluetooth path runs about 240 ms behind the office's USB
    # output; tuned by ear against the office with a click track.
    latency_ms: 240

  office:
    roles:
      - common
      - web
      - selfupdate
      - snapclient
      # The office Pi 5 also drives an Inky frame (frame id 'office'), so the hub
      # republishes its art history and mirror under /frames/office/. The frame
      # app is installed by nightstand_bootstrap; the Pi keeps playing audio.
      - nightstand_bootstrap
    room_label: "Office"
    host_id: office
    # The frame hardware (the Inky) is not wired to the office Pi yet, so
    # nightstand_bootstrap installs nothing here: no clone, no installer, no
    # service, no verify check. The host still appears as a frame on the hub
    # (offline until installed). Flip this to true in a one-line PR once the
    # display is attached. See AGENTS.md ("frame_hardware").
    frame_hardware: false
    output:
      kind: alsa
      # The USB audio adapter, addressed by ALSA card name (not index, which can
      # reorder across boots): card id 'Device' [USB Audio Device], playback
      # device 0. snapclient gets this verbatim as --soundcard (snapclient role).
      device: "plughw:CARD=Device,DEV=0"
      speaker: null
    latency_ms: 0

  nightstand:
    roles:
      - common
      - web
      - selfupdate
      - bluetooth
      - snapclient
      - bt_speaker
      - nightstand_bootstrap
    room_label: "Bedroom"
    host_id: bedroom
    # The Inky frame is wired to the nightstand, so nightstand_bootstrap clones
    # and installs the frame app here (see AGENTS.md, "frame_hardware").
    frame_hardware: true
    output:
      kind: bluetooth
      device: null
      speaker: jbl
    # The JBL's Bluetooth path runs about 128 ms behind the office's USB
    # output; tuned by ear with a click track. Its delay shifts by about 10 ms
    # each time the Bluetooth stream restarts, so this is the middle of that range.
    latency_ms: 128
